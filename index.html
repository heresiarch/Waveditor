<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaveEditor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: #d4d4d4;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #252525;
      border-bottom: 1px solid #3a3a3a;
      flex-shrink: 0;
    }

    #toolbar button {
      background: #3a3a3a;
      color: #d4d4d4;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }

    #toolbar button:hover {
      background: #4a4a4a;
    }

    #toolbar button:active {
      background: #5a5a5a;
    }

    #infoLabel {
      margin-left: auto;
      color: #888;
      font-size: 13px;
      white-space: nowrap;
    }

    /* ── Canvas ── */
    #canvasWrapper {
      flex-shrink: 0;
      width: 100%;
      height: 360px;
      background: #111;
      border-bottom: 1px solid #3a3a3a;
    }

    #waveCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Wave list ── */
    #bottomPanel {
      flex: 1 1 0;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    #waveList {
      width: 30%;
      height: 100%;
      overflow-y: auto;
      padding: 8px 10px;
      background: #ffffff;
      border-right: 1px solid #cccccc;
    }

    #waveList table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      color: #111111;
    }

    #waveList th {
      text-align: left;
      padding: 4px 8px;
      border-bottom: 2px solid #cccccc;
      color: #333333;
      font-weight: 600;
      background: #f5f5f5;
    }

    #waveList td {
      padding: 3px 8px;
      border-bottom: 1px solid #e0e0e0;
      color: #000000;
    }

    #waveList tr:hover td {
      background: #e8f0ff;
      cursor: pointer;
    }

    #waveList tr.selected td {
      background: #d0e4ff;
    }

    /* ── Detail canvas ── */
    #detailCanvasWrapper {
      width: 70%;
      background: #ffffff;
    }

    #detailCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <button id="btnLoad">Load</button>
    <button id="btnSave">Save</button>
    <button id="btnCompile">Compile</button>
    <button id="btnExport">Export</button>
    <button id="btnLoadTemplate">Load Template</button>
    <span id="infoLabel">No data loaded</span>
  </div>

  <div id="canvasWrapper">
    <canvas id="waveCanvas"></canvas>
  </div>

  <div id="bottomPanel">
    <div id="waveList">
      <!-- populated by Compiler after Compile is clicked -->
    </div>
    <div id="detailCanvasWrapper">
      <canvas id="detailCanvas"></canvas>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
